
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - My Academic Guide</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #08070D;
            font-family: Arial, sans-serif;
            color: white;
        }

        .login-container {
            width: 90%;
            max-width: 400px;
            padding: 35px;
            background: #15101F;
            border: 1px solid #F5CB62;
            border-radius: 12px;
            text-align: center;
        }

        h1 {
            color: #F5CB62;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #BD76FF;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #F5CB62;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #211532;
            border: 1px solid #8B24E8;
            border-radius: 6px;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #F5CB62;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4B137D;
            border: 1px solid #F5CB62;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #6B20A8;
        }

        .register-link {
            margin-top: 22px;
            color: #BD76FF;
        }

        .register-link a {
            color: #F5CB62;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #FF7777;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>MY ACADEMIC GUIDE</h1>
    <p class="subtitle">Welcome back! Login to continue.</p>

    <p class="error-message" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/login}" method="post">

        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" required>
        </div>

        <button type="submit">Login</button>

    </form>

    <p class="register-link">
        Don't have an account?
        <a th:href="@{/register}">Create Account</a>
    </p>

</div>

</body>
</html>
