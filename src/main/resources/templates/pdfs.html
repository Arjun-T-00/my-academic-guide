
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PDFs - Academic Guide</title>

    <style>
        body {
            background: #10091C;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 950px;
            margin: auto;
        }

        h1 {
            color: #F5CB62;
            text-align: center;
        }

        h2 {
            color: #FFFFFF;
        }

        .section, .subject-card {
            background: #1D1230;
            border: 1px solid #F5CB62;
            border-radius: 12px;
            padding: 22px;
            margin: 22px 0;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border-radius: 7px;
            border: 1px solid #F5CB62;
            background: #10091C;
            color: white;
        }

        button {
            padding: 11px 20px;
            border: 1px solid #F5CB62;
            border-radius: 8px;
            background: #8B24E8;
            color: white;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s ease;
        }

        button:hover {
            background: #A344F0;
            border-color: #FFD966;
            box-shadow: 0 0 10px #F5CB6244;
        }

        .edit-button {
            color: #B44CFF;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .edit-button:hover {
            color: #8b0000;
            text-decoration: none;
        }

        .pdf-item {
            background: #0D0914;
            border: 1px solid #F5CB62;
            padding: 14px;
            border-radius: 8px;
            margin-top: 12px;
        }

        .pdf-item a, .back-link {
            color: #BD76FF;
            text-decoration: none;
            font-weight: 600;
        }

        .pdf-item a:hover, .back-link:hover {
            color: #F5CB62;
        }

        .message {
            color: #F5CB62;
            text-align: center;
        }

        .action-form {
            margin-top: 10px;
        }

        .edit-form {
            margin-top: 12px;
        }
        .subject-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .subject-header h2 {
            font-size: 28px;
            margin: 0;
            color: #F5CB62;
        }

        .subject-actions {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .subject-actions form {
            margin: 0;
        }

        .subject-actions .edit-button {
            color: #B44CFF;
            text-decoration: none;
            font-weight: 600;
        }

        .subject-actions .edit-button:hover {
            color: #D29AFF;
        }

        .delete-link {
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            color: #E57373;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .delete-link:hover {
            background: none;
            border: none;
            box-shadow: none;
            color: #8B0000;
        }
        .pdf-title-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .pdf-title-header strong {
            font-size: 19px;
            color: white;
        }

        .pdf-actions {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .edit-link {
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            color: #B44CFF;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .edit-link:hover {
            background: none;
            border: none;
            box-shadow: none;
            color: #D29AFF;
        }

        .pdf-actions .delete-link {
            background: none;
            border: none;
            padding: 0;
            margin: 0;
            color: #E57373;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .pdf-actions .delete-link:hover {
            background: none;
            border: none;
            box-shadow: none;
            color: #8B0000;
        }
        .form-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .form-actions button {
            margin-top: 0;
        }
    </style>
</head>

<body>
<div class="container">

    <a href="/" class="back-link">← Back to Home</a>

    <h1>My PDFs</h1>

    <p class="message"
        th:if="${param.error == 'subjectNotEmpty'}">
        Cannot delete this subject! Please delete all its PDFs first.
    </p>

    <p class="message"
        th:if="${param.error == 'deleteFailed'}">
        Could not delete the subject. Please try again.
    </p>

    <p class="message"
        th:if="${param.message == 'subjectDeleted'}">
        Subject deleted successfully!
    </p>

    <!-- Add Subject -->
    <div class="section">
        <h2>Add New Subject</h2>

        <form action="/subjects" method="post">
            <input type="text"
                   name="name"
                   placeholder="Enter subject name"
                   maxlength="100"
                   required>

            <div class="form-actions">
                <button type="submit">Add Subject</button>
            </div>   
        </form>
    </div>

    <!-- Upload PDF -->
    <div class="section">
        <h2>Upload Study Material</h2>

        <form action="/pdfs/upload"
              method="post"
              enctype="multipart/form-data">

            <input type="text"
                   name="title"
                   placeholder="Enter title name (e.g. Unit 1 )"
                   maxlength="255"
                   required>

            <select name="subjectId" required>
                <option value="">Select Subject</option>

                <option th:each="item : ${subjects}"
                        th:value="${item.id}"
                        th:text="${item.name}">
                </option>
            </select>

            <input type="file"
                   name="file"
                   accept=".pdf,application/pdf"
                   required>

            <div class="form-actions">
                <button type="submit">Upload PDF</button>
            </div>
        </form>

        <p style="color:#BD76FF;">
            Maximum PDF size: 20 MB
        </p>
    </div>

    <!-- Display Subjects and PDFs -->
    <h2>My Study Materials</h2>

    <div th:each="item : ${subjects}" class="subject-card">

        <!-- Subject Name and Actions -->
        <div class="subject-header">

        <h2 th:text="${item.name}"></h2>

        <div class="subject-actions">

            <a th:href="@{/subjects/edit/{id}(id=${item.id})}"
                class="edit-button">
                Edit
            </a>

            <form th:action="@{/subjects/delete/{id}(id=${item.id})}"
                    method="post"
                    onsubmit="return confirm('Are you sure you want to delete this subject?');">

                <button type="submit" class="delete-link">
                    Delete
                </button>

            </form>

        </div>

    </div>

        <!-- Edit Subject Form -->
        <div th:if="${editingSubject != null and editingSubject and subject != null and item.id == subject.id}"
             class="edit-form">

            <h3>Edit Subject Name</h3>

            <form action="/subjects/update" method="post">

                <input type="hidden"
                       name="id"
                       th:value="${subject.id}">

                <input type="text"
                       name="name"
                       th:value="${subject.name}"
                       maxlength="100"
                       required>

                <button type="submit">Update Subject</button>

            </form>
        </div>

        
    <!-- Display PDFs under this Subject -->
    <div th:each="pdf : ${pdfs}"
        th:if="${pdf.subjectId == item.id}"
        class="pdf-item">

        <!-- PDF Title and Actions -->
        <div class="pdf-title-header">

            <strong th:text="${pdf.title}"></strong>

            <div class="pdf-actions">

                <!-- Edit PDF Title -->
                <button type="button"
                        class="edit-link"
                        th:attr="onclick=|togglePdfEdit(${pdf.id})|">
                    Edit
                </button>

                <!-- Delete PDF -->
                <form th:action="@{/pdfs/delete/{id}(id=${pdf.id})}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this PDF?');">

                    <button type="submit" class="delete-link">
                        Delete
                    </button>

                </form>

            </div>
        </div>

        <!-- Open PDF -->
        <p>
            <a th:href="@{/pdfs/download/{id}(id=${pdf.id})}">
                Open / Download PDF
            </a>
        </p>

        <!-- Edit PDF Title Form -->
        <form th:id="|edit-pdf-${pdf.id}|"
              action="/pdfs/update"
              method="post"
              class="edit-form"
              style="display:none;">

            <input type="hidden"
                   name="id"
                   th:value="${pdf.id}">

            <input type="text"
                   name="title"
                   th:value="${pdf.title}"
                   maxlength="255"
                   required>

            <button type="submit">Update PDF Title</button>

        </form>

    </div>


    </div>

    </div>
    <script th:if="${param.error != null and param.error[0] == 'subjectNotEmpty'}">
        alert("Cannot delete this subject! Please delete all its PDFs first.");
    </script>
    <script>
        function togglePdfEdit(id) {

            const form = document.getElementById("edit-pdf-" + id);

            if (form.style.display === "none") {
                form.style.display = "block";
            }
            else {
                form.style.display = "none";
            }
        }
    </script>
</body>
</html>
